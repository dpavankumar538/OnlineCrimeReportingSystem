{% extends "base.html" %}
{% block title %}Login — CrimePortal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="mb-0">
                    <i class="bi bi-shield-lock me-2"></i>Login to CrimePortal
                </h4>
            </div>

            <div class="card-body p-4">
                <!-- action="" means POST to the same URL (/login) -->
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            Email Address
                        </label>
                        <input type="email" class="form-control"
                               id="email" name="email"
                               placeholder="your@email.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            Password
                        </label>
                        <div class="input-group">
                            <input type="password" class="form-control"
                                   id="password" name="password"
                                   placeholder="••••••••" required>
                            <!-- Toggle password visibility -->
                            <button class="btn btn-outline-secondary"
                                    type="button" id="togglePass">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer text-center text-muted py-3">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="text-danger fw-semibold">
                    Register here
                </a>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Toggle password show/hide
document.getElementById('togglePass').addEventListener('click', function() {
    const pwd  = document.getElementById('password');
    const icon = this.querySelector('i');
    if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
    } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
    }
});
</script>
{% endblock %}
