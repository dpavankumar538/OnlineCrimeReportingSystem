{% extends "base.html" %}
{% block title %}Register — CrimePortal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-danger text-white text-center py-3">
                <h4 class="mb-0">
                    <i class="bi bi-person-plus me-2"></i>Create Citizen Account
                </h4>
            </div>

            <div class="card-body p-4">
                <form method="POST" action="">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name *</label>
                            <input type="text" class="form-control"
                                   name="full_name" placeholder="John Doe" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email Address *</label>
                            <input type="email" class="form-control"
                                   name="email" placeholder="john@example.com" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control"
                                   name="phone" placeholder="9876543210">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Address</label>
                            <input type="text" class="form-control"
                                   name="address" placeholder="City, State">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Password *</label>
                            <input type="password" class="form-control"
                                   name="password" placeholder="Min 6 characters"
                                   id="pwd" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Confirm Password *</label>
                            <input type="password" class="form-control"
                                   name="confirm_password" placeholder="Re-enter password"
                                   id="cpwd" required>
                            <div id="matchMsg" class="form-text"></div>
                        </div>

                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="bi bi-check-circle me-2"></i>Create Account
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer text-center text-muted py-3">
                Already registered?
                <a href="{{ url_for('login') }}" class="text-dark fw-semibold">Login here</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Real-time password match check
const pwd  = document.getElementById('pwd');
const cpwd = document.getElementById('cpwd');
const msg  = document.getElementById('matchMsg');

cpwd.addEventListener('input', function() {
    if (pwd.value === cpwd.value) {
        msg.textContent = '✓ Passwords match';
        msg.className   = 'form-text text-success';
    } else {
        msg.textContent = '✗ Passwords do not match';
        msg.className   = 'form-text text-danger';
    }
});
</script>
{% endblock %}
