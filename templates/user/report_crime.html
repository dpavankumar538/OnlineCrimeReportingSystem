{% extends "base.html" %}
{% block title %}Report a Crime{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">

        <div class="card shadow border-0">
            <div class="card-header bg-danger text-white py-3">
                <h4 class="mb-0">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    Submit a Crime Report
                </h4>
                <small class="opacity-75">
                    All reports are kept confidential and reviewed by authorities
                </small>
            </div>

            <div class="card-body p-4">
                <!--
                    enctype="multipart/form-data" is REQUIRED
                    whenever your form has a file upload input.
                -->
                <form method="POST" action="" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Crime Type *</label>
                        <select class="form-select" name="crime_type" required>
                            <option value="" disabled selected>-- Select crime type --</option>
                            <option>Theft</option>
                            <option>Assault</option>
                            <option>Robbery</option>
                            <option>Fraud</option>
                            <option>Vandalism</option>
                            <option>Cybercrime</option>
                            <option>Domestic Violence</option>
                            <option>Drug Offense</option>
                            <option>Murder</option>
                            <option>Kidnapping</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Incident Location *</label>
                        <input type="text" class="form-control" name="location"
                               placeholder="e.g., MG Road, Bengaluru" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">District</label>
                        <input type="text" class="form-control" name="district"
                               placeholder="e.g., Bengaluru Urban">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Description of Incident *
                        </label>
                        <textarea class="form-control" name="description"
                                  rows="5" required
                                  placeholder="Describe what happened — include date, time, people involved, and any other details...">
                        </textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Upload Evidence (Optional)
                        </label>
                        <input type="file" class="form-control" name="evidence"
                               accept=".jpg,.jpeg,.png,.pdf,.mp4">
                        <div class="form-text">
                            Accepted formats: JPG, PNG, PDF, MP4. Max size: 16MB.
                        </div>
                    </div>

                    <div class="d-flex gap-3 mt-4">
                        <button type="submit" class="btn btn-danger px-5">
                            <i class="bi bi-send-fill me-2"></i>Submit Report
                        </button>
                        <a href="{{ url_for('user_dashboard') }}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
